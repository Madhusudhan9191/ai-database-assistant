<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="100%" height="100%">
    <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
        <stop offset="0%" stop-color="#0A1128" />
        <stop offset="100%" stop-color="#05070F" />
    </radialGradient>
    
    <!-- Neon Gradients -->
    <linearGradient id="blue-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3B82F6" />
        <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="emerald-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#10B981" />
        <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="purple-pink" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#8B5CF6" />
        <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="purple-blue" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#7C3AED" />
        <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="yellow-orange" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F59E0B" />
        <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    
    <!-- Glassmorphic Gradients -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    
    <!-- Neon Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" result="blur" />
        <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
        </feMerge>
    </filter>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
        </feMerge>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
        </feMerge>
    </filter>
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" result="blur" />
        <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
        </feMerge>
    </filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" result="blur" />
        <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
        </feMerge>
    </filter>
    
    <!-- Drop Shadow for Panels -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
</defs>

    <style>
    text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        fill: #FFFFFF;
    }
    .title { font-weight: 800; }
    .subtitle { fill: #94A3B8; font-weight: 500; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .dim { fill: #64748B; }
    .cyan-text { fill: #22D3EE; }
    .blue-text { fill: #38BDF8; }
    .emerald-text { fill: #34D399; }
    .purple-text { fill: #C084FC; }
    .red-text { fill: #F87171; }
    .yellow-text { fill: #FBBF24; }
    .border-stroke { stroke: rgba(255, 255, 255, 0.08); stroke-width: 1px; }
    .border-stroke-glow { stroke: #06B6D4; stroke-width: 1.5px; filter: url(#glow-cyan); }
    .grid-line { stroke: rgba(255, 255, 255, 0.03); stroke-width: 1px; }
</style>

    <!-- Background -->
    <rect width="3840" height="2160" fill="url(#bg-grad)" />
    <line x1="0" y1="0" x2="0" y2="2160" class="grid-line" />
<line x1="160" y1="0" x2="160" y2="2160" class="grid-line" />
<line x1="320" y1="0" x2="320" y2="2160" class="grid-line" />
<line x1="480" y1="0" x2="480" y2="2160" class="grid-line" />
<line x1="640" y1="0" x2="640" y2="2160" class="grid-line" />
<line x1="800" y1="0" x2="800" y2="2160" class="grid-line" />
<line x1="960" y1="0" x2="960" y2="2160" class="grid-line" />
<line x1="1120" y1="0" x2="1120" y2="2160" class="grid-line" />
<line x1="1280" y1="0" x2="1280" y2="2160" class="grid-line" />
<line x1="1440" y1="0" x2="1440" y2="2160" class="grid-line" />
<line x1="1600" y1="0" x2="1600" y2="2160" class="grid-line" />
<line x1="1760" y1="0" x2="1760" y2="2160" class="grid-line" />
<line x1="1920" y1="0" x2="1920" y2="2160" class="grid-line" />
<line x1="2080" y1="0" x2="2080" y2="2160" class="grid-line" />
<line x1="2240" y1="0" x2="2240" y2="2160" class="grid-line" />
<line x1="2400" y1="0" x2="2400" y2="2160" class="grid-line" />
<line x1="2560" y1="0" x2="2560" y2="2160" class="grid-line" />
<line x1="2720" y1="0" x2="2720" y2="2160" class="grid-line" />
<line x1="2880" y1="0" x2="2880" y2="2160" class="grid-line" />
<line x1="3040" y1="0" x2="3040" y2="2160" class="grid-line" />
<line x1="3200" y1="0" x2="3200" y2="2160" class="grid-line" />
<line x1="3360" y1="0" x2="3360" y2="2160" class="grid-line" />
<line x1="3520" y1="0" x2="3520" y2="2160" class="grid-line" />
<line x1="3680" y1="0" x2="3680" y2="2160" class="grid-line" />
<line x1="0" y1="0" x2="3840" y2="0" class="grid-line" />
<line x1="0" y1="160" x2="3840" y2="160" class="grid-line" />
<line x1="0" y1="320" x2="3840" y2="320" class="grid-line" />
<line x1="0" y1="480" x2="3840" y2="480" class="grid-line" />
<line x1="0" y1="640" x2="3840" y2="640" class="grid-line" />
<line x1="0" y1="800" x2="3840" y2="800" class="grid-line" />
<line x1="0" y1="960" x2="3840" y2="960" class="grid-line" />
<line x1="0" y1="1120" x2="3840" y2="1120" class="grid-line" />
<line x1="0" y1="1280" x2="3840" y2="1280" class="grid-line" />
<line x1="0" y1="1440" x2="3840" y2="1440" class="grid-line" />
<line x1="0" y1="1600" x2="3840" y2="1600" class="grid-line" />
<line x1="0" y1="1760" x2="3840" y2="1760" class="grid-line" />
<line x1="0" y1="1920" x2="3840" y2="1920" class="grid-line" />
<line x1="0" y1="2080" x2="3840" y2="2080" class="grid-line" />

    
    <!-- Nodes -->
    <circle cx="200" cy="500" r="12" fill="#3B82F6" opacity="0.3" filter="url(#glow-blue)" />
    <circle cx="450" cy="300" r="8" fill="#06B6D4" opacity="0.2" filter="url(#glow-cyan)" />
    <circle cx="350" cy="800" r="14" fill="#8B5CF6" opacity="0.25" filter="url(#glow-purple)" />
    <circle cx="800" cy="200" r="10" fill="#10B981" opacity="0.2" filter="url(#glow-emerald)" />
    <circle cx="3600" cy="400" r="14" fill="#3B82F6" opacity="0.3" filter="url(#glow-blue)" />
    <circle cx="3400" cy="800" r="10" fill="#8B5CF6" opacity="0.2" filter="url(#glow-purple)" />
    <circle cx="3500" cy="1500" r="18" fill="#06B6D4" opacity="0.25" filter="url(#glow-cyan)" />
    <circle cx="400" cy="1600" r="12" fill="#10B981" opacity="0.2" filter="url(#glow-emerald)" />
    
    <!-- Connectors -->
    <path d="M 200 500 Q 325 400 450 300" stroke="#06B6D4" stroke-width="2" fill="none" opacity="0.15" />
    <path d="M 200 500 Q 275 650 350 800" stroke="#8B5CF6" stroke-width="3" fill="none" opacity="0.15" />
    <path d="M 450 300 Q 625 250 800 200" stroke="#10B981" stroke-width="2" fill="none" opacity="0.1" />
    <path d="M 3600 400 Q 3500 600 3400 800" stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.15" />
    <path d="M 3400 800 Q 3450 1150 3500 1500" stroke="#06B6D4" stroke-width="3" fill="none" opacity="0.15" />
    
    
    <!-- Glow effects in background -->
    <circle cx="1920" cy="1080" r="800" fill="#3B82F6" opacity="0.08" filter="url(#glow-blue)" />
    <circle cx="900" cy="500" r="600" fill="#06B6D4" opacity="0.05" filter="url(#glow-cyan)" />
    <circle cx="2800" cy="1500" r="700" fill="#8B5CF6" opacity="0.06" filter="url(#glow-purple)" />
    
    <!-- TITLE BLOCK -->
    <g transform="translate(200, 180)">
        <text x="0" y="0" font-size="80" class="title" fill="url(#blue-cyan)">AI Database Assistant</text>
        <text x="0" y="70" font-size="36" class="subtitle">Natural Language Business Intelligence Platform</text>
    </g>
    
    <!-- CENTRAL DASHBOARD -->
    <!-- Dashboard Outer Container -->
    <rect x="672" y="378" width="2496" height="1404" rx="32" fill="url(#glass)" stroke="url(#glass-border)" stroke-width="4" filter="url(#shadow)" />
    
    <!-- Dashboard Top Bar -->
    <g transform="translate(672, 378)">
        <rect x="0" y="0" width="2496" height="88" fill="rgba(10, 15, 30, 0.9)" rx="32" />
        <rect x="0" y="56" width="2496" height="32" fill="rgba(10, 15, 30, 0.9)" />
        <line x1="0" y1="88" x2="2496" y2="88" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
        <!-- Window Controls -->
        <circle cx="60" cy="44" r="12" fill="#EF4444" />
        <circle cx="100" cy="44" r="12" fill="#F59E0B" />
        <circle cx="140" cy="44" r="12" fill="#10B981" />
        
        <!-- Status Indicator -->
        <text x="240" y="52" font-size="24" fill="#94A3B8">Database Connections: <tspan fill="#34D399" font-weight="bold">● postgresql_prod (12ms)</tspan></text>
        
        <!-- Security indicator -->
        <rect x="2100" y="24" width="340" height="40" rx="20" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="2" />
        <text x="2130" y="50" font-size="20" class="emerald-text" font-weight="bold">🛡️ SQL Validator Enabled</text>
    </g>
    
    <!-- Dashboard Content Columns -->
    <!-- LEFT PANEL: Schema Explorer (width 500) -->
    <g transform="translate(712, 506)">
        <rect width="500" height="1220" rx="24" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2" />
        <text x="40" y="60" font-size="32" font-weight="bold">Schema Explorer</text>
        <text x="40" y="110" font-size="22" class="dim">Active Schema: public</text>
        
        <!-- DB Connections List -->
        <text x="40" y="180" font-size="24" font-weight="bold" fill="#38BDF8">Connections</text>
        <rect x="40" y="210" width="420" height="80" rx="16" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" />
        <text x="70" y="255" font-size="22" font-weight="bold">🐘 PostgreSQL (prod_db)</text>
        
        <!-- Table tree -->
        <text x="40" y="350" font-size="24" font-weight="bold" fill="#94A3B8">Tables (12)</text>
        
        <!-- Table rows -->
        <g transform="translate(40, 390)">
            <!-- Table: users -->
            <text x="30" y="30" font-size="22" font-weight="bold" fill="#E2E8F0">田 users</text>
            <text x="60" y="70" font-size="20" class="dim">🔑 id <tspan fill="#38BDF8">INT</tspan></text>
            <text x="60" y="110" font-size="20" class="dim">👤 email <tspan fill="#38BDF8">VARCHAR</tspan></text>
            
            <!-- Table: orders -->
            <text x="30" y="180" font-size="22" font-weight="bold" fill="#E2E8F0">田 orders</text>
            <text x="60" y="220" font-size="20" class="dim">🔑 id <tspan fill="#38BDF8">INT</tspan></text>
            <text x="60" y="260" font-size="20" class="dim">🔗 user_id <tspan fill="#38BDF8">INT (FK)</tspan></text>
            <text x="60" y="300" font-size="20" class="dim">💰 total_amount <tspan fill="#38BDF8">DECIMAL</tspan></text>
            <text x="60" y="340" font-size="20" class="dim">📍 region <tspan fill="#38BDF8">VARCHAR</tspan></text>
            
            <!-- Table: products -->
            <text x="30" y="410" font-size="22" font-weight="bold" fill="#E2E8F0">田 products</text>
        </g>
    </g>
    
    <!-- CENTER PANEL: AI Chat & Results -->
    <g transform="translate(1252, 506)">
        <rect width="1336" height="1220" rx="24" fill="rgba(15, 23, 42, 0.4)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2" />
        
        <!-- User Chat Prompt Area -->
        <g transform="translate(40, 40)">
            <rect width="1256" height="100" rx="20" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
            <text x="40" y="60" font-size="26" fill="#E2E8F0">💬 Show monthly revenue by region for 2025</text>
            <rect x="1100" y="25" width="120" height="50" rx="12" fill="url(#blue-cyan)" />
            <text x="1135" y="58" font-size="20" font-weight="bold">Run</text>
        </g>
        
        <!-- Generated SQL (Groq LLM Engine) -->
        <g transform="translate(40, 180)">
            <rect width="1256" height="340" rx="20" fill="#030712" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2" />
            <path d="M 0 20 A 20 20 0 0 1 20 0 L 1236 0 A 20 20 0 0 1 1256 20 L 1256 60 L 0 60 Z" fill="rgba(255,255,255,0.03)" />
            <text x="30" y="38" font-size="22" font-weight="bold" fill="#38BDF8">🛠️ Generated SQL (Groq LLM Engine)</text>
            <rect x="1040" y="12" width="186" height="36" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5" />
            <text x="1055" y="36" font-size="16" class="emerald-text" font-weight="bold">Self-Healing SQL Verified</text>
            
            <g transform="translate(30, 110)" class="mono" font-size="24">
                <text x="0" y="0"><tspan class="purple-text">SELECT</tspan></text>
                <text x="0" y="40">    DATE_TRUNC(<tspan class="cyan-text">'month'</tspan>, order_date) <tspan class="purple-text">AS</tspan> order_month,</text>
                <text x="0" y="80">    region,</text>
                <text x="0" y="120">    SUM(total_amount) <tspan class="purple-text">AS</tspan> monthly_revenue</text>
                <text x="0" y="160"><tspan class="purple-text">FROM</tspan> orders</text>
                <text x="0" y="200"><tspan class="purple-text">WHERE</tspan> EXTRACT(<tspan class="purple-text">YEAR FROM</tspan> order_date) = <tspan class="emerald-text">2025</tspan></text>
                <text x="0" y="240"><tspan class="purple-text">GROUP BY</tspan> <tspan class="emerald-text">1</tspan>, <tspan class="emerald-text">2</tspan> <tspan class="purple-text">ORDER BY</tspan> <tspan class="emerald-text">1</tspan> <tspan class="purple-text">ASC</tspan>;</text>
            </g>
        </g>
        
        <!-- Live Chart visualization area -->
        <g transform="translate(40, 560)">
            <rect width="1256" height="620" rx="20" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
            <text x="40" y="50" font-size="26" font-weight="bold">📊 Interactive Charts</text>
            
            <!-- Grid lines for Chart -->
            <g transform="translate(100, 120)" opacity="0.3">
                <line x1="0" y1="400" x2="1080" y2="400" stroke="#64748B" stroke-width="2" />
                <line x1="0" y1="300" x2="1080" y2="300" stroke="#64748B" stroke-dasharray="8 8" />
                <line x1="0" y1="200" x2="1080" y2="200" stroke="#64748B" stroke-dasharray="8 8" />
                <line x1="0" y1="100" x2="1080" y2="100" stroke="#64748B" stroke-dasharray="8 8" />
            </g>
            
            <path d="M 200 480 L 380 400 L 560 220 L 740 300 L 920 180 L 1100 140" fill="none" stroke="url(#blue-cyan)" stroke-width="8" filter="url(#glow-blue)" />
            <path d="M 200 500 L 380 430 L 560 380 L 740 280 L 920 250 L 1100 210" fill="none" stroke="url(#purple-pink)" stroke-width="8" filter="url(#glow-purple)" />
            
            <g transform="translate(100, 560)" font-size="20">
                <text x="100" y="0" class="dim">Jan</text>
                <text x="280" y="0" class="dim">Feb</text>
                <text x="460" y="0" class="dim">Mar</text>
                <text x="640" y="0" class="dim">Apr</text>
                <text x="820" y="0" class="dim">May</text>
                <text x="1000" y="0" class="dim">Jun</text>
            </g>
        </g>
    </g>
    
    <!-- RIGHT PANEL: AI Insights Engine -->
    <g transform="translate(2628, 506)">
        <rect width="500" height="1220" rx="24" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2" />
        <text x="40" y="60" font-size="32" font-weight="bold" fill="url(#purple-pink)">AI Insights Engine</text>
        <line x1="40" y1="90" x2="460" y2="90" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
        
        <!-- Executive Summary -->
        <g transform="translate(40, 130)">
            <text x="0" y="30" font-size="24" font-weight="bold" fill="#38BDF8">Executive Summary</text>
            <rect x="0" y="50" width="420" height="620" rx="16" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="2" />
            
            <g transform="translate(30, 80)">
                <circle cx="10" cy="20" r="6" fill="#3B82F6" />
                <text x="30" y="30" font-size="20" font-weight="bold">Revenue Spike in March</text>
                <text x="30" y="65" font-size="18" class="dim">North region sales grew by 45%.</text>
                
                <circle cx="10" cy="160" r="6" fill="#8B5CF6" />
                <text x="30" y="170" font-size="20" font-weight="bold">Q2 Steady Expansion</text>
                <text x="30" y="205" font-size="18" class="dim">South region shows a steady 8% MoM</text>
                <text x="30" y="235" font-size="18" class="dim">growth trend through June.</text>
                
                <circle cx="10" cy="320" r="6" fill="#10B981" />
                <text x="30" y="330" font-size="20" font-weight="bold">Confidence Score: 98%</text>
                <text x="30" y="365" font-size="18" class="dim">Calculated by Schema Understanding.</text>
            </g>
        </g>
    </g>
    
    <!-- FLOATING BADGES -->
    <g transform="translate(180, 850)">
        <rect width="360" height="100" rx="20" fill="rgba(10, 15, 30, 0.85)" stroke="url(#glass-border)" stroke-width="2" filter="url(#shadow)" />
        <text x="40" y="58" font-size="24">🗂️</text>
        <text x="90" y="45" font-size="22" font-weight="bold">Schema Explorer</text>
        <text x="90" y="75" font-size="18" fill="#10B981">Database relationships mapped</text>
    </g>
    
    <g transform="translate(3250, 240)">
        <rect width="440" height="110" rx="20" fill="rgba(10, 15, 30, 0.85)" stroke="url(#glass-border)" stroke-width="2" filter="url(#shadow)" />
        <text x="40" y="63" font-size="26">🔧</text>
        <text x="90" y="45" font-size="22" font-weight="bold">Self-Healing SQL Repair</text>
        <text x="90" y="78" font-size="18" class="cyan-text">Exception loop active: 100% health</text>
    </g>
</svg>